version: "3.9"

services:
  db:
    image: postgres:16
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: always
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py loaddata initial_data.json &&
      python manage.py runserver 0.0.0.0:8000
      "
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db

  worker:
    build: .
    restart: always
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py assign_tasks
      "
    env_file: .env
    depends_on:
      - db

volumes:
  postgres_data: